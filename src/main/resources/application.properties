# Common configuration shared by all profiles.
# Environment-specific overrides live in application-{dev,sit,prod}.properties.
# Activate a profile with: --spring.profiles.active=prod (or SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=dev

server.port=8085
abdm.wrapper.url=https://ABDM_WRAPPER/bundle

# FHIR Validation Configuration
fhir.validation.fail-on-error=true
fhir.validation.log-details=true
# Sends terminology codes to https://tx.fhir.org/r4 during validation (external network call).
# Keep false in production; enable only if local IG + in-memory terminology is insufficient.
fhir.validation.remote-terminology.enabled=false

# Database (defaults to H2; override per profile)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=abdm
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.banner.location=classpath:banner.txt
