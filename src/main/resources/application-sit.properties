# SIT (System Integration Test) profile: mirrors prod behavior for testers,
# with H2 console and INFO logs for debugging integration issues.
# FHIR validation is ON so profile violations surface before production.
fhir.validation.enabled=true

spring.datasource.url=jdbc:h2:mem:fhir_mapper;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# LOGGER
logging.level.in.nha.abdm.fhir.mapper=INFO

spring.devtools.restart.enabled=false
