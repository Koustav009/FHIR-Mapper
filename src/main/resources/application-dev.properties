# Development profile: local H2, verbose logs, hot reload.
# FHIR validation is OFF so bundles build without profile strictness.
fhir.validation.enabled=false

spring.datasource.url=jdbc:h2:mem:fhir_mapper;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# LOGGER
logging.level.in.nha.abdm.fhir.mapper=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=TRACE
#logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=TRACE
#logging.level.org.springframework.web.HttpLogging=TRACE

# Devtools auto-reload on file change
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=300ms
