# Production profile: strictest settings.
# - FHIR validation OFF by default to preserve existing consumer behavior
#   (INPS endpoints skip it regardless; flip to true once downstream consumers
#   have been tested against strict NRCES/IPS profile validation).
# - Remote terminology stays off (common config) so no data leaves the network.
# - H2 console disabled; logs at WARN.
fhir.validation.enabled=false

spring.datasource.url=jdbc:h2:mem:fhir_mapper;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

spring.h2.console.enabled=false

# LOGGER
logging.level.in.nha.abdm.fhir.mapper=WARN
logging.level.root=INFO

spring.devtools.restart.enabled=false
